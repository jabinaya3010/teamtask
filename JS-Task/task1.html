<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login with OTP</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Register -->
<div id="registerPage">

    <h1 class="bg-blue-600 text-white text-center p-4 text-2xl font-bold">
        REGISTER
    </h1>

    <div class="flex flex-col items-center mt-10">

        <input
            type="tel"
            id="regNumber"
            maxlength="10"
            placeholder="Enter Mobile Number"
            class="border w-80 h-10 p-2 rounded mb-4">

        <input
            type="password"
            id="regPassword"
            placeholder="Enter Password"
            class="border w-80 h-10 p-2 rounded mb-4">

        <button
            onclick="register()"
            class="bg-green-600 text-white px-6 py-2 rounded">
            Register
        </button>

    </div>

</div>

<!-- Login -->
<div id="loginPage" class="hidden">

    <h1 class="bg-blue-700 text-white text-center p-4 text-2xl font-bold">
        LOGIN
    </h1>

    <div class="flex flex-col items-center mt-10">

        <input
            type="tel"
            id="loginNumber"
            maxlength="10"
            placeholder="Enter Mobile Number"
            class="border w-80 h-10 p-2 rounded mb-4">

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
            class="border w-80 h-10 p-2 rounded mb-4">

        <button
            onclick="login()"
            class="bg-blue-600 text-white px-6 py-2 rounded">
            Login
        </button>

    </div>

</div>

<!-- OTP -->
<div id="otpPage" class="hidden">

    <h1 class="bg-purple-600 text-white text-center p-4 text-2xl font-bold">
        OTP VERIFICATION
    </h1>

    <div class="flex flex-col items-center mt-10">

        <p class="mb-3 text-green-700 font-bold">
            Demo OTP : 1234
        </p>

        <input
            type="text"
            id="otp"
            maxlength="4"
            placeholder="Enter OTP"
            class="border w-80 h-10 p-2 rounded mb-4">

        <button
            onclick="verifyOTP()"
            class="bg-purple-600 text-white px-6 py-2 rounded">
            Verify OTP
        </button>

    </div>

</div>

<!-- Landing -->
<div id="landingPage" class="hidden">

    <h1 class="bg-green-600 text-white text-center p-5 text-3xl font-bold">
        Welcome
    </h1>

    <div class="text-center mt-10">

        <h2 class="text-3xl font-bold">
            🎉 Login Successful
        </h2>

        <p class="mt-4 text-lg">
            Welcome to the Landing Page.
        </p>

    </div>

</div>

<script>

function register(){

    let number=document.getElementById("loginNumber").value;
    let password=document.getElementById("loginPassword").value;

    if(number==="" || password===""){
        alert("Please fill all fields");
        return;
    }

    let user={
        number:number,
        password:password,
        otp:"1234"
    };

    localStorage.setItem("user",JSON.stringify(user));

    alert("Registration Successful");

    document.getElementById("registerPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");

}

function login(){

    let number=document.getElementById("loginNumber").value;
    let password=document.getElementById("loginPassword").value;

    let user=JSON.parse(localStorage.getItem("user"));

    if(user==null){
        alert("Please Register First");
        return;
    }

    if(number===user.number && password===user.password){

        alert("Login Successful");

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("otpPage").classList.remove("hidden");

    }
    else{

        alert("Invalid Mobile Number or Password");

    }

}

function verifyOTP(){

    let otp=document.getElementById("otp").value;

    let user=JSON.parse(localStorage.getItem("user"));

    if(otp===user.otp){

        alert("OTP Verified Successfully");

        document.getElementById("otpPage").classList.add("hidden");
        document.getElementById("landingPage").classList.remove("hidden");

    }
    else{

        alert("Invalid OTP");

    }

}

</script>

</body>
</html>
